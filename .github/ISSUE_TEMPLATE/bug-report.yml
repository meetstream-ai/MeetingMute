name: Bug report
description: A popup slipped through, the wrong thing was closed, or something else broke.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Which app's popup or notification, during which meeting app, and what you expected.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In MeetingMute, open Settings › General › "Copy for a Bug Report" and paste it here. It has versions, settings and recent activity, and no window contents or meeting data.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of the popup
      description: Drag an image here. If you have Accessibility Inspector, the popup's subrole and button labels help a lot.
